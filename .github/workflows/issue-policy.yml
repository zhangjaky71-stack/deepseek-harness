name: Issue policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/issue-management/policy.mjs pr

  canvas-n06-final-stack:
    name: Canvas N06 final-stack validation
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/canvas-n06-final-stack-trusted-trigger'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out N06 validation branch
        uses: actions/checkout@v6
        with:
          ref: fix/canvas-n06-v2.2-remote-history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Run one-shot N06 final-stack validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/canvas-n06-final-stack-validate.sh')
          text = path.read_text()

          old = "{presentation.showOutput && canvas !== null && canvas.output !== null ? <OutputGrid canvas={canvas} interaction={interaction} onSelectOutput={onSelectOutput} t={t} /> : <div className={css.emptyOutput}>{t('minimal.emptyOutput')}</div>}"
          new = "{presentation.showOutput && canvas !== null && canvas.output !== null ? <OutputGrid canvas={canvas} {...(interaction === undefined ? {} : { interaction })} {...(onSelectOutput === undefined ? {} : { onSelectOutput })} t={t} /> : <div className={css.emptyOutput}>{t('minimal.emptyOutput')}</div>}"
          if text.count(old) != 1:
              raise SystemExit(f'validator exact-optional patch anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          anchor = "bundle_test = 'packages/client/ui-canvas/tests/client-bundle.client.spec.ts'\n"
          injection = anchor + "replace(\n    bundle_test,\n    \"canvasFeatures: { get: async () => ({ ok: true, value: capabilities(canvasEnabled) }) },\",\n    \"canvasFeatures: { get: async () => ({ ok: true, value: capabilities(canvasEnabled) }), listNodes: async () => ({ ok: true, value: [] }) },\\n      canvas: {},\\n      canvasInteraction: {},\",\n)\nreplace(\n    bundle_test,\n    \"    ctx.provide('remote.canvasFeatures', {} as never)\\n\",\n    \"    ctx.provide('remote.canvasFeatures', {} as never)\\n    ctx.provide('remote.canvas', {} as never)\\n    ctx.provide('remote.canvasInteraction', {} as never)\\n\",\n)\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'validator client-bundle anchor count={text.count(anchor)}')
          text = text.replace(anchor, injection, 1)

          cleanup_old = "git rm .github/workflows/canvas-n06-final-stack-hygiene.yml .github/canvas-n06-final-stack-validate.sh"
          cleanup_new = "git rm -f .github/workflows/canvas-n06-final-stack-hygiene.yml .github/canvas-n06-final-stack-validate.sh"
          if text.count(cleanup_old) != 1:
              raise SystemExit(f'validator cleanup anchor count={text.count(cleanup_old)}')
          text = text.replace(cleanup_old, cleanup_new, 1)

          path.write_text(text)
          PY
          bash .github/canvas-n06-final-stack-validate.sh
