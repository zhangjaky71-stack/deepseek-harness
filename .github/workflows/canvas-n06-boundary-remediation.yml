name: Canvas N06 boundary remediation

on:
  pull_request:
    branches:
      - fix/canvas-n06-v2.2-remote-history

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  boundary-remediation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n06-v2.2-remote-history
          fetch-depth: 0

      - name: Enforce weak DTO validation before authorization
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('packages/canvas/canvas/src/runtime.ts')
          text = runtime.read_text()

          old = """  replaceWorkflow(agent: Agent, ref: WorkflowRef, workflow: MediaWorkflow, access?: CanvasAccessContext): CanvasSnapshot {\n    const prepared = this.prepare(agent, 'canvas.edit', access)\n    const features = this.featurePolicy()\n    features?.assertEnabled('canvas')\n    this.assertBrowserEditorEnabled(prepared.access, features)\n    const replacement = cloneWorkflow(workflow)\n    try {\n      assertMediaWorkflow(replacement)\n    } catch (error) {\n      if (error instanceof CanvasDomainError) invalidEdit('Canvas replacement workflow is invalid')\n      throw error\n    }\n    features?.assertWorkflowCreatable(replacement)\n    this.assertWorkflowAuditSafe(replacement)\n    const current = this.expectCurrentWorkflow(prepared.cache, workflowRefInput(ref))\n"""
          new = """  replaceWorkflow(agent: Agent, ref: WorkflowRef, workflow: MediaWorkflow, access?: CanvasAccessContext): CanvasSnapshot {\n    const validatedRef = workflowRefInput(ref)\n    let replacement: MediaWorkflow\n    try {\n      replacement = cloneWorkflow(workflow)\n      assertMediaWorkflow(replacement)\n    } catch {\n      invalidEdit('Canvas replacement workflow is invalid')\n    }\n    const prepared = this.prepare(agent, 'canvas.edit', access)\n    const features = this.featurePolicy()\n    features?.assertEnabled('canvas')\n    this.assertBrowserEditorEnabled(prepared.access, features)\n    features?.assertWorkflowCreatable(replacement)\n    this.assertWorkflowAuditSafe(replacement)\n    const current = this.expectCurrentWorkflow(prepared.cache, validatedRef)\n"""
          if text.count(old) != 1:
              raise SystemExit(f'replaceWorkflow ordering replacement count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  editWorkflow(\n    agent: Agent,\n    ref: WorkflowRef,\n    operations: readonly WorkflowEditOperation[],\n    access?: CanvasAccessContext,\n  ): CanvasSnapshot {\n    const prepared = this.prepare(agent, 'canvas.edit', access)\n    const features = this.featurePolicy()\n    features?.assertEnabled('canvas')\n    this.assertBrowserEditorEnabled(prepared.access, features)\n    const current = this.expectCurrentWorkflow(prepared.cache, workflowRefInput(ref))\n    const validatedOperations = workflowEditOperations(operations)\n"""
          new = """  editWorkflow(\n    agent: Agent,\n    ref: WorkflowRef,\n    operations: readonly WorkflowEditOperation[],\n    access?: CanvasAccessContext,\n  ): CanvasSnapshot {\n    const validatedRef = workflowRefInput(ref)\n    const validatedOperations = workflowEditOperations(operations)\n    const prepared = this.prepare(agent, 'canvas.edit', access)\n    const features = this.featurePolicy()\n    features?.assertEnabled('canvas')\n    this.assertBrowserEditorEnabled(prepared.access, features)\n    const current = this.expectCurrentWorkflow(prepared.cache, validatedRef)\n"""
          if text.count(old) != 1:
              raise SystemExit(f'editWorkflow ordering replacement count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  clear(agent: Agent, ref: WorkflowRef, access?: CanvasAccessContext): void {\n    const prepared = this.prepare(agent, 'canvas.edit', access)\n    this.assertFeature('canvas')\n    const validatedRef = workflowRefInput(ref)\n"""
          new = """  clear(agent: Agent, ref: WorkflowRef, access?: CanvasAccessContext): void {\n    const validatedRef = workflowRefInput(ref)\n    const prepared = this.prepare(agent, 'canvas.edit', access)\n    this.assertFeature('canvas')\n"""
          if text.count(old) != 1:
              raise SystemExit(f'clear ordering replacement count={text.count(old)}')
          runtime.write_text(text.replace(old, new, 1))

      - name: Add pre-authorization boundary regressions and faithful history fixture
        shell: python
        run: |
          from pathlib import Path

          remote = Path('packages/canvas/canvas/tests/remote.spec.ts')
          text = remote.read_text()
          text = text.replace(
              "import { Context } from '@deepseek-ai/cordis'\n",
              "import { Context, Service } from '@deepseek-ai/cordis'\n",
              1,
          )
          text = text.replace(
              "  CanvasAuthorizationService,\n  CanvasRunId,\n",
              "  CanvasAuthorizationService,\n  CanvasRunId,\n  type CanvasAuthorizationDecision,\n  type CanvasAuthorizationRequest,\n",
              1,
          )
          anchor = """function liveAgent(ctx: Context, sessionId: string): Agent {\n"""
          helper = """class BoundaryAuthorizationService extends Service {\n  readonly requests: CanvasAuthorizationRequest[] = []\n\n  constructor(ctx: Context) {\n    super(ctx, 'canvasAuthorization')\n  }\n\n  authorize(request: CanvasAuthorizationRequest): CanvasAuthorizationDecision {\n    this.requests.push(structuredClone(request))\n    return { allowed: true }\n  }\n}\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'remote boundary service anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)

          anchor = """  it('pages newest-first by stable run-start Session cursor even when a later run is appended', async () => {\n"""
          regression = """  it('rejects malformed weak mutation DTOs before authorization or business logic', async () => {\n    const { ctx, agent } = await harness()\n    const created = ctx.canvas.create(agent, { workflow: baseWorkflow() })\n    await ctx.plugin(BoundaryAuthorizationService)\n    const policy = ctx.get('canvasAuthorization') as unknown as BoundaryAuthorizationService\n\n    expect(() => ctx.canvas.remoteExportEditWorkflow(\n      agent,\n      { canvasId: created.id } as never,\n      [{ op: 'rename-workflow', name: 'never reached' }],\n    )).toThrow(expect.objectContaining({ code: 'CANVAS_INVALID_EDIT' }))\n    expect(policy.requests).toHaveLength(0)\n\n    expect(() => ctx.canvas.remoteExportEditWorkflow(\n      agent,\n      workflowRef(created),\n      [{ op: 'unsupported-op' }] as never,\n    )).toThrow(expect.objectContaining({ code: 'CANVAS_INVALID_EDIT' }))\n    expect(policy.requests).toHaveLength(0)\n\n    expect(() => ctx.canvas.remoteExportReplaceWorkflow(\n      agent,\n      workflowRef(created),\n      { id: 'workflow-main' } as never,\n    )).toThrow(expect.objectContaining({ code: 'CANVAS_INVALID_EDIT' }))\n    expect(policy.requests).toHaveLength(0)\n\n    expect(() => ctx.canvas.remoteExportClear(\n      agent,\n      { canvasId: created.id, workflowId: 'workflow-main', workflowRevision: 0 } as never,\n    )).toThrow(expect.objectContaining({ code: 'CANVAS_INVALID_EDIT' }))\n    expect(policy.requests).toHaveLength(0)\n  })\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'remote boundary regression anchor count={text.count(anchor)}')
          remote.write_text(text.replace(anchor, regression + anchor, 1))

          history = Path('packages/canvas/canvas/tests/history-authorization.spec.ts')
          text = history.read_text()
          text = text.replace(
              "  baseWorkflow,\n  runStartChange,\n",
              "  baseWorkflow,\n  currentWriterChange,\n  runStartChange,\n",
              1,
          )
          text = text.replace(
              "} from './canvas-fixtures.ts'\n",
              "} from './canvas-fixtures.ts'\nimport { withCanvasWritePermit } from '../src/write-authority.ts'\n",
              1,
          )
          anchor = """function currentCanvas(ctx: Context, agent: Agent): CanvasSnapshot {\n"""
          helper = """function appendCurrentChange(agent: Agent, change: ReturnType<typeof currentWriterChange>): void {\n  withCanvasWritePermit(agent.session, 'canvas/change', change, () => {\n    agent.session.append('canvas/change', change)\n  })\n}\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'history auth helper anchor count={text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)
          text = text.replace(
              "  agent.session.append('canvas/change', runStartChange(before, CanvasRunId(id)))\n",
              "  appendCurrentChange(agent, currentWriterChange(runStartChange(before, CanvasRunId(id))))\n",
              1,
          )
          text = text.replace(
              "  agent.session.append('canvas/change', runUpdateChange(queued, 'completed'))\n",
              "  appendCurrentChange(agent, currentWriterChange(runUpdateChange(queued, 'completed')))\n",
              1,
          )
          history.write_text(text)

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Verify immutable install
        run: pnpm install --frozen-lockfile
      - name: Run N06 boundary/history regressions
        run: >-
          pnpm exec vitest run
          packages/canvas/canvas/tests/remote.spec.ts
          packages/canvas/canvas/tests/history-authorization.spec.ts
          packages/canvas/canvas/tests/history-index.spec.ts
          packages/api/gateway/tests/business-failure.spec.ts
          packages/typert/protocol/tests/business-failure.spec.ts
      - name: Commit validated N06 boundary remediation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/canvas-n06-boundary-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(canvas): validate N06 weak DTOs before authorization'
          git push origin HEAD:fix/canvas-n06-v2.2-remote-history
