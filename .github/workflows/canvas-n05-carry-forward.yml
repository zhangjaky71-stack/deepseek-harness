name: Canvas N05 predecessor carry-forward

on:
  pull_request:
    branches:
      - fix/canvas-n05-v2.2-projection-layout

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  carry-forward:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n05-v2.2-projection-layout
          fetch-depth: 0
      - name: Carry validated N04 predecessor contracts into N05
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/canvas-n04-v2.2-host-security
          n04=FETCH_HEAD
          for path in \
            .agents/workplans/canvas-v2.1/implementations/N03.md \
            .agents/workplans/canvas-v2.1/implementations/N04.md \
            packages/canvas/canvas/tests/authorization-hardening.spec.ts \
            packages/canvas/canvas/tests/authorization.spec.ts \
            packages/canvas/canvas/tests/features.spec.ts \
            packages/canvas/canvas/tests/fold.spec.ts \
            packages/canvas/canvas/tests/invariant.spec.ts \
            packages/canvas/canvas/tests/interaction-bridge.spec.ts \
            packages/canvas/canvas/tests/service.spec.ts \
            pnpm-lock.yaml
          do
            git show "$n04:$path" > "$path"
          done
      - name: Patch N05-owned cross-layer files without overwriting N05 semantics
        shell: python
        run: |
          from pathlib import Path

          runtime = Path('packages/canvas/canvas/src/runtime.ts')
          text = runtime.read_text()
          old = """    if (sessionId === undefined) {\n      if (this.ctx.get('canvasAuthorization') !== undefined || this.authorizationMode === 'required-external') return false\n      const access = canvasBrowserAccess('detached-session')\n      return this.fallbackAuthorization.authorize({\n        permission: 'canvas.read',\n        actor: access.actor,\n        source: access.source,\n        sessionId: 'detached-session',\n        resource: this.projectionAuthorizationResource(value),\n      }).allowed\n    }\n"""
          new = "    if (sessionId === undefined) return false\n"
          if text.count(old) != 1:
              raise SystemExit(f'runtime detached branch replacement count={text.count(old)}')
          runtime.write_text(text.replace(old, new, 1))

          projection = Path('packages/canvas/canvas/tests/projection.spec.ts')
          text = projection.read_text()
          old = "    const restored = Session.create(SessionId('canvas-projection-restored'), first.session.events)\n"
          new = "    const restored = ctx.sessions.create(SessionId('canvas-projection-restored'), { seed: first.session.events })\n"
          if text.count(old) != 1:
              raise SystemExit(f'projection live restore replacement count={text.count(old)}')
          projection.write_text(text.replace(old, new, 1))

          remote = Path('packages/canvas/canvas/tests/remote.spec.ts')
          text = remote.read_text()
          import_anchor = "import type { CanvasSnapshot } from '@deepseek-ai/dsh-canvas'\n"
          permit_import = import_anchor + "import { withCanvasWritePermit } from '../src/write-authority.ts'\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('remote CanvasSnapshot import anchor missing')
          text = text.replace(import_anchor, permit_import, 1)
          fixture_anchor = "  baseWorkflow,\n  runStartChange,\n"
          fixture_new = "  baseWorkflow,\n  currentWriterChange,\n  runStartChange,\n"
          if text.count(fixture_anchor) != 1:
              raise SystemExit('remote fixture import anchor missing')
          text = text.replace(fixture_anchor, fixture_new, 1)
          function_old = """function appendCompletedRun(ctx: Context, agent: Agent, id: string): void {\n  const before = currentCanvas(ctx, agent)\n  agent.session.append('canvas/change', runStartChange(before, CanvasRunId(id)))\n  const queued = currentCanvas(ctx, agent)\n  agent.session.append('canvas/change', runUpdateChange(queued, 'completed'))\n  currentCanvas(ctx, agent)\n}\n"""
          function_new = """function appendCurrentChange(agent: Agent, change: ReturnType<typeof currentWriterChange>): void {\n  withCanvasWritePermit(agent.session, 'canvas/change', change, () => {\n    agent.session.append('canvas/change', change)\n  })\n}\n\nfunction appendCompletedRun(ctx: Context, agent: Agent, id: string): void {\n  const before = currentCanvas(ctx, agent)\n  appendCurrentChange(agent, currentWriterChange(runStartChange(before, CanvasRunId(id))))\n  const queued = currentCanvas(ctx, agent)\n  appendCurrentChange(agent, currentWriterChange(runUpdateChange(queued, 'completed')))\n  currentCanvas(ctx, agent)\n}\n"""
          if text.count(function_old) != 1:
              raise SystemExit(f'remote append helper replacement count={text.count(function_old)}')
          remote.write_text(text.replace(function_old, function_new, 1))
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Verify immutable install after predecessor carry-forward
        run: pnpm install --frozen-lockfile
      - name: Commit carry-forward to N05
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/canvas-n05-carry-forward.yml
          if git diff --quiet; then
            echo 'No carry-forward changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(canvas): carry validated N04 contracts into N05'
          git push origin HEAD:fix/canvas-n05-v2.2-projection-layout
