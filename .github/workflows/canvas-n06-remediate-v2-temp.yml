name: canvas-n06-remediate-v2-temp

on:
  push:
    paths:
      - '.github/workflows/canvas-n06-remediate-v2-temp.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/canvas-n06-v2.2-remote-history
          fetch-depth: 0
      - name: Apply corrected exact N06 patches
        run: python3 scripts/canvas-n06-remediate-temp.py
      - name: Commit remediation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            packages/canvas/canvas/src/history.ts \
            packages/canvas/canvas/src/runtime.ts \
            packages/api/gateway/src/index.ts \
            packages/bundle/base/cordis.patch.yml \
            packages/bundle/base/package.json \
            packages/bundle/base/tests/base.spec.ts \
            packages/api/remotes/tests/built-lib.e2e.ts
          git diff --cached --check
          git commit -m 'fix(canvas): close N06 remote and composition boundaries'
          git push origin HEAD:fix/canvas-n06-v2.2-remote-history
