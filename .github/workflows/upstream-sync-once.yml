name: one-shot upstream sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: upstream-sync-rc8
  cancel-in-progress: true

jobs:
  merge-upstream:
    if: github.head_ref == 'sync/upstream-rc8'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Merge official master onto private main
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/upstream-sync"
          rm -rf "$work"
          mkdir -p "$work"
          cd "$work"

          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" fetch origin main --no-tags
          git checkout -b sync-base FETCH_HEAD

          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --no-tags

          if ! git merge --no-ff --no-edit upstream/master; then
            echo "::error::Upstream merge has conflicts; no branch update was pushed."
            echo "Conflict files:"
            git diff --name-only --diff-filter=U
            echo "Status:"
            git status --short
            exit 1
          fi

          trigger_sha='${{ github.event.pull_request.head.sha }}'
          echo "Merged tree: $(git rev-parse HEAD)"
          echo "Official upstream: $(git rev-parse upstream/master)"
          git -c http.extraheader="AUTHORIZATION: bearer ${GITHUB_TOKEN}" push \
            --force-with-lease="refs/heads/sync/upstream-rc8:${trigger_sha}" \
            origin HEAD:refs/heads/sync/upstream-rc8
