name: one-shot upstream sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: upstream-sync-rc8
  cancel-in-progress: true

jobs:
  merge-upstream:
    if: github.head_ref == 'sync/upstream-rc8'
    runs-on: [self-hosted, dsh-win-ci, windows]
    timeout-minutes: 30
    steps:
      - name: Checkout sync trigger
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge official master onto private main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote remove upstream 2>$null
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --no-tags

          $triggerSha = '${{ github.event.pull_request.head.sha }}'
          git fetch origin main
          git reset --hard origin/main

          git merge --no-ff --no-edit upstream/master
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Upstream merge has conflicts; no branch update was pushed.'
            git diff --name-only --diff-filter=U
            git status --short
            exit 1
          }

          Write-Host "Merged tree: $(git rev-parse HEAD)"
          Write-Host "Official upstream: $(git rev-parse upstream/master)"
          git push --force-with-lease="refs/heads/sync/upstream-rc8:$triggerSha" origin HEAD:refs/heads/sync/upstream-rc8
