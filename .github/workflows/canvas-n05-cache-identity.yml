name: Canvas N05 cache identity remediation

on:
  pull_request:
    branches:
      - fix/canvas-n05-v2.2-projection-layout

permissions:
  contents: write

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  cache-identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n05-v2.2-projection-layout
          fetch-depth: 0

      - name: Strengthen projection cache lifecycle identity
        shell: python
        run: |
          from pathlib import Path

          spec = Path('packages/session/session-projection-cache/src/spec.ts')
          text = spec.read_text()
          old = """export const checkpointIdentity = z.object({\n  createdAt: z.number().int().nonnegative(),\n  cwd: z.string().optional(),\n})\n"""
          new = """export const checkpointIdentity = z.object({\n  version: z.number().int().nonnegative(),\n  createdAt: z.number().int().nonnegative(),\n  cwd: z.string().optional(),\n  parentSession: z.string().optional(),\n  seedLength: z.number().int().nonnegative().optional(),\n  origin: z.literal('subagent').optional(),\n  delegationDepth: z.number().int().nonnegative().optional(),\n  agentPreset: z.string().optional(),\n})\n"""
          if text.count(old) != 1:
              raise SystemExit(f'checkpointIdentity replacement count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace("  version: 3,\n", "  version: 4,\n", 1)
          spec.write_text(text)

          index = Path('packages/session/session-projection-cache/src/index.ts')
          text = index.read_text()
          old = """function identityOf(header: SessionHeader): CheckpointIdentity {\n  return { createdAt: header.createdAt, ...header.cwd === undefined ? {} : { cwd: header.cwd } }\n}\n\n/** Whether a stored record's bound identity names the caller's lifecycle. */\nfunction identityMatches(stored: CheckpointIdentity, expected: CheckpointIdentity): boolean {\n  return stored.createdAt === expected.createdAt && stored.cwd === expected.cwd\n}\n"""
          new = """function identityOf(header: SessionHeader): CheckpointIdentity {\n  return {\n    version: header.version,\n    createdAt: header.createdAt,\n    ...header.cwd === undefined ? {} : { cwd: header.cwd },\n    ...header.parentSession === undefined ? {} : { parentSession: header.parentSession },\n    ...header.seedLength === undefined ? {} : { seedLength: header.seedLength },\n    ...header.origin === undefined ? {} : { origin: header.origin },\n    ...header.delegationDepth === undefined ? {} : { delegationDepth: header.delegationDepth },\n    ...header.agentPreset === undefined ? {} : { agentPreset: header.agentPreset },\n  }\n}\n\n/** Whether a stored record's bound identity names the caller's lifecycle. */\nfunction identityMatches(stored: CheckpointIdentity, expected: CheckpointIdentity): boolean {\n  return stored.version === expected.version\n    && stored.createdAt === expected.createdAt\n    && stored.cwd === expected.cwd\n    && stored.parentSession === expected.parentSession\n    && stored.seedLength === expected.seedLength\n    && stored.origin === expected.origin\n    && stored.delegationDepth === expected.delegationDepth\n    && stored.agentPreset === expected.agentPreset\n}\n"""
          if text.count(old) != 1:
              raise SystemExit(f'identityOf/matches replacement count={text.count(old)}')
          index.write_text(text.replace(old, new, 1))

          test = Path('packages/session/session-projection-cache/tests/cache.spec.ts')
          text = test.read_text()
          text = text.replace(
              "import type { Session, SessionEvent } from '@deepseek-ai/dsh-session'\n",
              "import type { Session, SessionEvent, SessionHeader } from '@deepseek-ai/dsh-session'\n",
              1,
          )
          old = """const headerOf = (id: SessionId, createdAt = 0, cwd?: string) =>\n  ({ version: 0, id, createdAt, ...cwd === undefined ? {} : { cwd } })\n"""
          new = """const headerOf = (\n  id: SessionId,\n  createdAt = 0,\n  cwd?: string,\n  extra: Partial<Omit<SessionHeader, 'id' | 'version' | 'createdAt' | 'cwd'>> = {},\n): SessionHeader => ({\n  version: 0,\n  id,\n  createdAt,\n  ...cwd === undefined ? {} : { cwd },\n  ...extra,\n})\n"""
          if text.count(old) != 1:
              raise SystemExit(f'headerOf replacement count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = """      identity: { createdAt: number; cwd?: string }\n"""
          new = """      identity: Omit<SessionHeader, 'id'>\n"""
          if text.count(old) != 1:
              raise SystemExit(f'storedRecord identity type replacement count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = """    identity: { createdAt: number; cwd?: string } = { createdAt: 0 },\n  ): void {\n    pool.versions.set('session_projcache', 3)\n"""
          new = """    identity: Omit<SessionHeader, 'id'> = { version: 0, createdAt: 0 },\n  ): void {\n    pool.versions.set('session_projcache', 4)\n"""
          if text.count(old) != 1:
              raise SystemExit(f'seedRow identity/version replacement count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace("{ createdAt: 999 })", "{ version: 0, createdAt: 999 })", 1)
          text = text.replace("toEqual({ createdAt: 0 })", "toEqual({ version: 0, createdAt: 0 })", 1)
          text = text.replace(
              "{ createdAt: 0, cwd: '/work' })",
              "{ version: 0, createdAt: 0, cwd: '/work' })",
              1,
          )
          anchor = """  it('dates an empty stored log at -1 in the zero-units topology', async () => {\n"""
          regression = """  it('binds cache rows to immutable lineage and preset identity even when createdAt/cwd match', async () => {\n    const pool = new MemoryMediaPool()\n    const priorIdentity: Omit<SessionHeader, 'id'> = {\n      version: 0,\n      createdAt: 0,\n      cwd: '/work',\n      parentSession: SessionId('parent-a'),\n      seedLength: 3,\n      origin: 'subagent',\n      delegationDepth: 1,\n      agentPreset: 'preset-a',\n    }\n    seedRow(pool, 'same-clock', { ver: 1, seq: 2, val: { marks: ['prior'] } }, priorIdentity)\n    const { cache } = await harness({ pool })\n    const id = SessionId('same-clock')\n\n    expect(cache.cachedSnapshot(headerOf(id, 0, '/work', {\n      parentSession: SessionId('parent-a'),\n      seedLength: 3,\n      origin: 'subagent',\n      delegationDepth: 1,\n      agentPreset: 'preset-a',\n    }))?.values['cache-test/marks']).toEqual({ marks: ['prior'] })\n\n    expect(cache.cachedSnapshot(headerOf(id, 0, '/work', {\n      parentSession: SessionId('parent-b'),\n      seedLength: 3,\n      origin: 'subagent',\n      delegationDepth: 1,\n      agentPreset: 'preset-a',\n    }))).toBeUndefined()\n\n    expect(cache.cachedSnapshot(headerOf(id, 0, '/work', {\n      parentSession: SessionId('parent-a'),\n      seedLength: 3,\n      origin: 'subagent',\n      delegationDepth: 1,\n      agentPreset: 'preset-b',\n    }))).toBeUndefined()\n  })\n\n"""
          if text.count(anchor) != 1:
              raise SystemExit(f'cache identity regression anchor count={text.count(anchor)}')
          test.write_text(text.replace(anchor, regression + anchor, 1))

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Verify immutable install
        run: pnpm install --frozen-lockfile

      - name: Run projection-cache focused regression
        run: >-
          pnpm exec vitest run
          packages/session/session-projection-cache/tests/cache.spec.ts
          packages/session/session-projection-cache/tests/read-identity.spec.ts

      - name: Commit validated cache identity remediation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/canvas-n05-cache-identity.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(session-projection-cache): bind rows to full session identity'
          git push origin HEAD:fix/canvas-n05-v2.2-projection-layout
