name: Canvas N11 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n11-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n11-sync-trigger'
    runs-on: ubuntu-24.04
    env:
      DSH_GATE_CONCURRENCY: '8'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n11-v2.2-editor-workspace
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Merge validated N10 predecessor and assert N11 ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/canvas-n10-v2.2-node-registry fix/canvas-n11-v2.2-editor-workspace
          git merge --no-edit origin/fix/canvas-n10-v2.2-node-registry
          git merge-base --is-ancestor origin/fix/canvas-n10-v2.2-node-registry HEAD
          test -z "$(git ls-files -u)"
          grep -Fq "definition.type === node.type && definition.version === version" packages/client/ui-canvas/src/client/catalog.ts
          grep -Fq "nodeCatalogAvailability(props.nodeCatalog, props.capabilities, selectedNode)" packages/client/ui-canvas/src/client/WorkflowEditor.tsx
          grep -Fq "const activeDraftSave = useRef<string | null>(null)" packages/client/ui-canvas/src/client/WorkflowEditor.tsx
          grep -Fq "window.setTimeout(() => { void saveDraft(draft) }, 450)" packages/client/ui-canvas/src/client/WorkflowEditor.tsx
          grep -Fq "reconcileProjectedLayoutRevision(" packages/client/ui-canvas/src/client/WorkflowEditor.tsx
          grep -Fq "{ nodeVersion: node.nodeVersion }" packages/client/ui-canvas/src/client/adapters.ts
          echo "N10->N11 ordinary merge + editor-workspace ownership assertions: PASS"

      - name: Install immutable candidate workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1 || { tail -n 220 /tmp/install.log; exit 1; }
          echo "N11 frozen workspace install: PASS"

      - name: Validate repository static gates against exact N10 baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/n10-static
          git worktree add --detach /tmp/n10-static origin/fix/canvas-n10-v2.2-node-registry >/tmp/worktree.log 2>&1
          (cd /tmp/n10-static && pnpm install --frozen-lockfile >/tmp/n10-install.log 2>&1) || { tail -n 220 /tmp/n10-install.log; exit 1; }

          set +e
          (cd /tmp/n10-static && pnpm run check:ci:static) >/tmp/base-static.log 2>&1
          base_static_status=$?
          pnpm run check:ci:static >/tmp/candidate-static.log 2>&1
          candidate_static_status=$?
          set -e

          BASE_STATUS="$base_static_status" CANDIDATE_STATUS="$candidate_static_status" python - <<'PY'
          from pathlib import Path
          import os, re

          base_status = int(os.environ['BASE_STATUS'])
          candidate_status = int(os.environ['CANDIDATE_STATUS'])
          pattern = re.compile(r'^  - FAILED (.+?) \(', re.MULTILINE)
          base_failed = set(pattern.findall(Path('/tmp/base-static.log').read_text(errors='replace')))
          candidate_failed = set(pattern.findall(Path('/tmp/candidate-static.log').read_text(errors='replace')))
          if candidate_status != 0 and not candidate_failed:
              raise SystemExit('N11 repository static failed without recognized failed-gate summary')
          if candidate_status != 0 and base_status == 0:
              raise SystemExit('N11 repository static FAIL while exact validated N10 baseline PASS')
          unexpected = candidate_failed - base_failed
          if unexpected:
              raise SystemExit(f'N11 introduced new failing static gates beyond exact N10 baseline: {sorted(unexpected)}')
          print(f'N11 full static failed-gate set is within exact N10 baseline: {sorted(candidate_failed)}')
          PY

          gates=(
            constraints
            verify-package-invariants
            verify-package-paths
            verify-node-next-types
            verify-runtime-closure
            verify-optional-dependency-imports
            verify-cordis-config
            verify-cordis-catalog
            verify-client-catalog
            verify-client-domain-graph
            verify-export-jsdoc
            verify-config-catalog
            verify-doc-graphs
            verify-package-readme-model-experience
            verify-agent-note-classification
            verify-agent-note-format
            verify-type-equiv
            verify-translation-pairing
            verify-module-graph
            knip
          )

          for gate in "${gates[@]}"; do
            set +e
            (cd /tmp/n10-static && pnpm run "$gate") >"/tmp/base-$gate.log" 2>&1
            base_status=$?
            pnpm run "$gate" >"/tmp/candidate-$gate.log" 2>&1
            candidate_status=$?
            set -e
            BASE_STATUS="$base_status" CANDIDATE_STATUS="$candidate_status" GATE="$gate" python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import os, re

          gate = os.environ['GATE']
          base_status = int(os.environ['BASE_STATUS'])
          candidate_status = int(os.environ['CANDIDATE_STATUS'])
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          candidate_root = str(Path.cwd())
          baseline_root = '/tmp/n10-static'
          paren_location = re.compile(r'(\((?:packages|apps|scripts|docs|\.agents)/[^():]+):\d+(?::\d+)?\)')
          prefix_location = re.compile(r'^((?:packages|apps|scripts|docs|\.agents)/[^:]+):(?: line )?\d+(?::\d+)?:')

          def normalized(path: str) -> Counter[str]:
              out: Counter[str] = Counter()
              for raw in Path(path).read_text(errors='replace').splitlines():
                  line = ansi.sub('', raw).strip()
                  line = line.replace(candidate_root, '<ROOT>').replace(baseline_root, '<ROOT>')
                  if not line:
                      continue
                  if line.startswith('> @deepseek-ai/dsh-root@') or line.startswith('$ '):
                      continue
                  if line.startswith('ELIFECYCLE') or line.startswith('ERR_PNPM'):
                      continue
                  if gate == 'verify-export-jsdoc' and re.fullmatch(r'verify-export-jsdoc: \d+ JSDoc completeness violation\(s\) \(see AGENTS\.md\):', line):
                      continue
                  line = paren_location.sub(lambda match: re.sub(r':\d+(?::\d+)?\)$', ':<LINE>)', match.group(0)), line)
                  line = prefix_location.sub(lambda match: re.sub(r'(?:: line |:)\d+(?::\d+)?:$', ':<LINE>:', match.group(0)), line)
                  out[line] += 1
              return out

          base = normalized(f'/tmp/base-{gate}.log')
          candidate = normalized(f'/tmp/candidate-{gate}.log')
          if candidate_status == 0:
              print(f'{gate}: candidate PASS (baseline status {base_status})')
          else:
              if base_status == 0:
                  raise SystemExit(f'{gate}: N11 FAIL while validated N10 baseline PASS')
              unexpected = candidate - base
              if unexpected:
                  print(f'=== {gate} N10 baseline ===')
                  print(Path(f'/tmp/base-{gate}.log').read_text(errors='replace'))
                  print(f'=== {gate} N11 candidate ===')
                  print(Path(f'/tmp/candidate-{gate}.log').read_text(errors='replace'))
                  details = sorted(unexpected.elements())
                  raise SystemExit(f'{gate}: N11 introduced diagnostics beyond N10 baseline: {details}')
              print(f'{gate}: no new diagnostics beyond N10 baseline ({sum(candidate.values())} candidate / {sum(base.values())} baseline normalized lines)')
          PY
          done
          git worktree remove --force /tmp/n10-static
          echo "N11 exact-baseline static diagnostic differential: PASS"

      - name: Validate Host build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:lib:host >/tmp/host-build.log 2>&1 || { tail -n 360 /tmp/host-build.log; exit 1; }
          echo "Host build: PASS"

      - name: Validate Client build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:lib:client >/tmp/client-build.log 2>&1 || { tail -n 360 /tmp/client-build.log; exit 1; }
          echo "Client build: PASS"

      - name: Run N11 focused and predecessor regressions
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/client/ui-canvas/tests/adapters.client.spec.ts \
            packages/client/ui-canvas/tests/catalog.client.spec.ts \
            packages/client/ui-canvas/tests/editor-components.client.spec.tsx \
            packages/client/ui-canvas/tests/workflow-editor.client.spec.tsx \
            packages/client/ui-canvas/tests/layout-revision.client.spec.ts \
            packages/canvas/media-workflow/tests/registry.spec.ts \
            packages/canvas/media-workflow/tests/plugin-node.spec.ts \
            packages/canvas/canvas/tests/migration.spec.ts \
            packages/canvas/canvas/tests/features.spec.ts \
            packages/canvas/canvas/tests/feature-settings.spec.ts \
            packages/canvas/canvas/tests/interaction-features.spec.ts \
            packages/canvas/canvas/tests/interaction.spec.ts \
            packages/canvas/canvas/tests/interaction-bridge.spec.ts \
            packages/client/ui-canvas/tests/capability-gate.client.spec.ts \
            packages/client/ui-canvas/tests/settings.client.spec.tsx \
            packages/client/ui-canvas/tests/features.client.spec.tsx \
            packages/client/ui-canvas/tests/interaction.client.spec.ts \
            packages/client/ui-canvas/tests/client-bundle.client.spec.ts \
            packages/bundle/base/tests/canvas-real-composition.spec.ts >/tmp/n11-tests.log 2>&1 || { tail -n 520 /tmp/n11-tests.log; exit 1; }
          tail -n 240 /tmp/n11-tests.log

      - name: Validate built package invariants
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify-built-package-invariants >/tmp/invariants.log 2>&1 || { tail -n 320 /tmp/invariants.log; exit 1; }
          tail -n 140 /tmp/invariants.log

      - name: Push only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/canvas-n11-v2.2-editor-workspace