name: Canvas N08 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n08-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n08-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n08-v2.2-interaction-context
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Merge validated N07 predecessor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/canvas-n07-v2.2-dynamic-surface fix/canvas-n08-v2.2-interaction-context
          git merge --no-edit origin/fix/canvas-n07-v2.2-dynamic-surface
          git diff --check
          test -z "$(git ls-files -u)"
          git merge-base --is-ancestor origin/fix/canvas-n07-v2.2-dynamic-surface HEAD
          grep -Fq "CanvasInteractionBridge" packages/canvas/canvas/src/interaction-bridge.ts
          grep -Fq "shell.main" packages/client/ui-canvas/src/client/CanvasView.tsx
          echo "N07->N08 merge and ownership assertions: PASS"

      - name: Align N08 feature-policy fixture with live SessionStore
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/canvas/canvas/tests/interaction-features.spec.ts')
          text = path.read_text()

          old_import = "import { Session, SessionId } from '@deepseek-ai/dsh-session'"
          new_import = "import SessionStore, { SessionId } from '@deepseek-ai/dsh-session'"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit('interaction-features: session import shape not recognized')

          old_session = "  const session = Session.create(SessionId('canvas-region-feature'))"
          new_session = "  const session = ctx.sessions.create(SessionId('canvas-region-feature'))"
          if old_session in text:
              text = text.replace(old_session, new_session, 1)
          elif new_session not in text:
              raise SystemExit('interaction-features: stub session shape not recognized')

          agent_plugin = '    await ctx.plugin(AgentRegistry)'
          session_plugin = '    await ctx.plugin(SessionStore)\n'
          current = text.count(session_plugin)
          if current == 0:
              count = text.count(agent_plugin)
              if count != 2:
                  raise SystemExit(f'interaction-features: expected 2 AgentRegistry anchors, found {count}')
              text = text.replace(agent_plugin, session_plugin + agent_plugin)
          elif current != 2:
              raise SystemExit(f'interaction-features: expected 0 or 2 SessionStore plugins, found {current}')

          path.write_text(text)
          PY

          git diff --check -- packages/canvas/canvas/tests/interaction-features.spec.ts
          test "$(grep -c "await ctx.plugin(SessionStore)" packages/canvas/canvas/tests/interaction-features.spec.ts)" -eq 2
          grep -Fq "ctx.sessions.create(SessionId('canvas-region-feature'))" packages/canvas/canvas/tests/interaction-features.spec.ts
          echo "N08 live SessionStore test fixture: PASS"

      - name: Install immutable workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1 || { tail -n 180 /tmp/install.log; exit 1; }
          echo "Frozen workspace install: PASS"

      - name: Validate inherited Host build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:lib:host >/tmp/host-build.log 2>&1 || { tail -n 260 /tmp/host-build.log; exit 1; }
          echo "Host build: PASS"

      - name: Validate inherited Client build
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm run build:lib:client >/tmp/client-build.log 2>&1; then
            echo "=== CLIENT BUILD DIAGNOSTICS ==="
            grep -E "error TS[0-9]+|ERROR|Error:|ELIFECYCLE|ERR_PNPM|ui-canvas|canvas/src/interaction" /tmp/client-build.log | tail -n 260 || true
            echo "=== CLIENT BUILD TAIL ==="
            tail -n 280 /tmp/client-build.log
            exit 1
          fi
          echo "Client build: PASS"

      - name: Run N08 focused and predecessor regressions
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/canvas/canvas/tests/interaction.spec.ts \
            packages/canvas/canvas/tests/interaction-bridge.spec.ts \
            packages/canvas/canvas/tests/interaction-features.spec.ts \
            packages/client/ui-canvas/tests/interaction.client.spec.ts \
            packages/client/ui-canvas/tests/capability-gate.client.spec.ts \
            packages/client/ui-canvas/tests/client-bundle.client.spec.ts \
            packages/bundle/base/tests/canvas-real-composition.spec.ts >/tmp/n08-tests.log 2>&1 || { tail -n 360 /tmp/n08-tests.log; exit 1; }
          tail -n 140 /tmp/n08-tests.log

      - name: Validate built package invariants
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify-built-package-invariants >/tmp/invariants.log 2>&1 || { tail -n 260 /tmp/invariants.log; exit 1; }
          tail -n 100 /tmp/invariants.log

      - name: Push only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git add packages/canvas/canvas/tests/interaction-features.spec.ts
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:fix/canvas-n08-v2.2-interaction-context
