name: Temporary upstream rc8 sync

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  merge-upstream:
    if: github.head_ref == 'sync/upstream-rc8-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge official master into sync result branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master
          git fetch origin sync/upstream-rc8-merged
          git checkout -B sync/upstream-rc8-merged origin/main

          set +e
          git merge --no-ff --no-commit upstream/master
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            echo "UPSTREAM_MERGE_CONFLICTS_BEGIN"
            git diff --name-only --diff-filter=U
            echo "UPSTREAM_MERGE_CONFLICTS_END"
            git status --short
            exit "$status"
          fi

          git commit -m "chore: sync upstream dsh 0.1.0-rc.8"
          git push --force-with-lease=refs/heads/sync/upstream-rc8-merged:$(git rev-parse origin/sync/upstream-rc8-merged) origin HEAD:refs/heads/sync/upstream-rc8-merged
