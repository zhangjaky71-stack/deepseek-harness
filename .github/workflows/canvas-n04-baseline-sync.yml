name: Canvas N04 baseline sync

on:
  push:
    branches:
      - fix/canvas-n04-v2.2-host-security
    paths:
      - .github/workflows/canvas-n04-baseline-sync.yml
  pull_request:
    branches:
      - fix/canvas-n04-v2.2-host-security

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n04-v2.2-host-security
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Apply validated N03 test-contract carry-forward
        shell: python
        run: |
          from pathlib import Path

          auth = Path('packages/canvas/canvas/tests/authorization.spec.ts')
          text = auth.read_text()
          old = '    expect(ctx.canvas.get(agent)).toEqual(created)\n'
          new = '    expect(ctx.canvas.get(agent, human)).toEqual(created)\n'
          if text.count(old) != 1:
              raise SystemExit(f'authorization replacement count={text.count(old)}')
          auth.write_text(text.replace(old, new, 1))

          inv = Path('packages/canvas/canvas/tests/invariant.spec.ts')
          text = inv.read_text()
          old_guard = "    const created = createChange()\n    session.append('canvas/change', created)\n    if (created.canvas === null || created.canvas.workflow === null) throw new Error('test Canvas lacks workflow')\n"
          new_guard = "    const created = createChange()\n    session.append('canvas/change', created)\n    const canvas = created.canvas\n    if (canvas === null || canvas.workflow === null) throw new Error('test Canvas lacks workflow')\n    const workflow = canvas.workflow\n"
          if text.count(old_guard) != 1:
              raise SystemExit(f'invariant guard replacement count={text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)
          old_workflow = '        workflowId: created.canvas.workflow.id,\n'
          if text.count(old_workflow) != 1:
              raise SystemExit(f'invariant workflow replacement count={text.count(old_workflow)}')
          text = text.replace(old_workflow, '        workflowId: workflow.id,\n', 1)
          old_updated = '        updatedAt: created.canvas.updatedAt,\n'
          if text.count(old_updated) < 1:
              raise SystemExit('invariant updatedAt target missing')
          text = text.replace(old_updated, '        updatedAt: canvas.updatedAt,\n', 1)
          inv.write_text(text)
      - name: Sync validated N03 implementation record
        shell: bash
        run: |
          git fetch origin fix/canvas-n03-v2.2-durable-authority
          git show FETCH_HEAD:.agents/workplans/canvas-v2.1/implementations/N03.md > .agents/workplans/canvas-v2.1/implementations/N03.md
      - name: Regenerate workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit N04 baseline synchronization
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No baseline synchronization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/workplans/canvas-v2.1/implementations/N03.md \
            packages/canvas/canvas/tests/authorization.spec.ts \
            packages/canvas/canvas/tests/invariant.spec.ts \
            pnpm-lock.yaml
          git commit -m 'chore(canvas): sync validated N03 baseline into N04'
          git push origin HEAD:fix/canvas-n04-v2.2-host-security
