name: Canvas N09 baseline static attribution

on:
  pull_request:
    branches:
      - main

jobs:
  n08-static-baseline:
    if: github.event.pull_request.head.ref == 'ci/canvas-n09-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n08-v2.2-interaction-context
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable N08 workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1 || { tail -n 180 /tmp/install.log; exit 1; }
          echo "N08 frozen install: PASS"

      - name: Capture exact N08 attribution diagnostics
        shell: bash
        run: |
          set +e
          pnpm run verify-package-readme-model-experience >/tmp/readme.log 2>&1
          readme_status=$?
          pnpm run verify-translation-pairing >/tmp/translation.log 2>&1
          translation_status=$?
          pnpm run verify-module-graph >/tmp/module.log 2>&1
          module_status=$?
          set -e

          echo "=== N08 README MODEL EXPERIENCE ==="
          cat /tmp/readme.log
          echo "=== N08 TRANSLATION PAIRING ==="
          cat /tmp/translation.log
          echo "=== N08 MODULE GRAPH ==="
          cat /tmp/module.log
          echo "ATTRIBUTION_STATUS readme=$readme_status translation=$translation_status module=$module_status"
          # Attribution deliberately succeeds: the candidate is judged against
          # this known failing predecessor baseline, not against an impossible
          # repository-wide zero-failure condition.
          exit 0
