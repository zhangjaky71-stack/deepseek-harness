name: Canvas N09 baseline static attribution

on:
  pull_request:
    branches:
      - main

jobs:
  n08-static-baseline:
    if: github.event.pull_request.head.ref == 'ci/canvas-n09-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n08-v2.2-interaction-context
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install immutable N08 workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1 || { tail -n 180 /tmp/install.log; exit 1; }
          echo "N08 frozen install: PASS"

      - name: Capture N08 package-boundary attribution diagnostics
        shell: bash
        run: |
          set +e
          gates=(constraints verify-package-invariants verify-cordis-config verify-client-catalog verify-config-catalog)
          for gate in "${gates[@]}"; do
            echo "=== N08 $gate ==="
            pnpm run "$gate" >"/tmp/$gate.log" 2>&1
            status=$?
            cat "/tmp/$gate.log"
            echo "ATTRIBUTION_GATE $gate status=$status"
          done
          set -e
          exit 0
