name: Canvas N07 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n07-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n07-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n07-v2.2-dynamic-surface
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Merge validated N06 and retain N07 product ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/canvas-n06-v2.2-remote-history fix/canvas-n07-v2.2-dynamic-surface
          git merge --no-edit -X ours origin/fix/canvas-n06-v2.2-remote-history

          # N06 made CanvasEditorState mutable for the store action draft. N07 adds
          # one new generation-owner field that must follow the same rule.
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/client/ui-canvas/src/client/store.ts')
          text = path.read_text()
          text = text.replace('  readonly owner: CanvasEditorOwner | null', '  owner: CanvasEditorOwner | null')
          path.write_text(text)
          PY

          git diff --check
          test -z "$(git ls-files -u)"
          git merge-base --is-ancestor origin/fix/canvas-n06-v2.2-remote-history HEAD
          grep -Fq "PropsRuntime<'shell.main'>" packages/client/ui-canvas/src/client/CanvasView.tsx
          grep -Fq "'shell.main': { kind: 'single'; scope: 'session'" packages/client/ui-layout/src/client/index.ts

      - name: Reconcile N07 workspace lock importer
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile

          changed="$(git diff --numstat -- pnpm-lock.yaml | awk '{ print $1 + $2 }')"
          test -n "$changed"
          test "$changed" -le 20

          python - <<'PY'
          from pathlib import Path
          text = Path('pnpm-lock.yaml').read_text()
          marker = '  packages/client/ui-canvas:\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('ui-canvas importer missing from pnpm-lock.yaml')
          next_importer = text.find('\n  packages/', start + len(marker))
          block = text[start:] if next_importer < 0 else text[start:next_importer]
          if "'@deepseek-ai/dsh-client-ui-layout':" not in block:
              raise SystemExit('ui-layout workspace dependency missing from ui-canvas lock importer')
          if 'specifier: workspace:^' not in block:
              raise SystemExit('workspace:^ specifier missing from ui-canvas lock importer')
          PY

          git diff --check -- pnpm-lock.yaml
          git diff --stat -- pnpm-lock.yaml

      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile

      - name: Validate inherited Host build
        run: pnpm run build:lib:host

      - name: Validate N07 Client build
        run: pnpm run build:lib:client

      - name: Run N07 focused regressions
        run: >-
          pnpm exec vitest run
          packages/client/ui-canvas/tests/capability-gate.client.spec.ts
          packages/client/ui-canvas/tests/client-bundle.client.spec.ts
          packages/client/ui-canvas/tests/features.client.spec.tsx
          packages/client/ui-canvas/tests/interaction.client.spec.ts
          packages/client/ui-canvas/tests/mode-store.client.spec.ts
          packages/client/ui-canvas/tests/store.client.spec.ts
          packages/client/ui-canvas/tests/view.client.spec.tsx
          packages/client/ui-canvas/tests/layout-revision.client.spec.ts
          packages/client/ui-canvas/tests/state.client.spec.ts
          packages/client/ui-layout/tests/app-frame.client.spec.tsx
          packages/client/ui-layout/tests/apply.client.spec.ts
          packages/client/ui-layout/tests/service.client.spec.ts
          packages/bundle/base/tests/canvas-real-composition.spec.ts

      - name: Validate built package invariants
        run: pnpm run verify-built-package-invariants

      - name: Commit and push only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml packages/client/ui-canvas/src/client/store.ts
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:fix/canvas-n07-v2.2-dynamic-surface
