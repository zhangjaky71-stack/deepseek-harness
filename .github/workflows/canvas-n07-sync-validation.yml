name: Canvas N07 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n07-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n07-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n07-v2.2-dynamic-surface
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Merge validated N06 and apply scoped N07 carry-forward fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/canvas-n06-v2.2-remote-history fix/canvas-n07-v2.2-dynamic-surface
          git merge --no-edit -X ours origin/fix/canvas-n06-v2.2-remote-history >/tmp/merge.log 2>&1 || { cat /tmp/merge.log; exit 1; }

          python - <<'PY'
          from pathlib import Path

          store = Path('packages/client/ui-canvas/src/client/store.ts')
          text = store.read_text()
          for field in ('owner', 'saveStatus', 'draft', 'undo', 'redo', 'clipboard', 'localPositions'):
              text = text.replace(f'  readonly {field}:', f'  {field}:')
          store.write_text(text)

          capability = Path('packages/client/ui-canvas/tests/capability-gate.client.spec.ts')
          text = capability.read_text()
          text = text.replace('while (contexts.length > 0) await contexts.pop()!.dispose()', 'while (contexts.length > 0) await contexts.pop()!.fiber.dispose()')
          old_register = "  slots.register({\n    name: 'root',\n    children: { 'shell.main': { kind: 'single', scope: 'session' } },\n  }, () => null)"
          new_register = "  slots.register({\n    name: 'root',\n    children: { 'shell.main': { kind: 'single', scope: 'session' } },\n    inject: () => ({}),\n  }, (_p: { renderSlot?: unknown }) => null)"
          if old_register in text:
              text = text.replace(old_register, new_register, 1)
          elif new_register not in text:
              raise SystemExit('capability-gate: shell.main root fixture shape not recognized')
          text = text.replace('(entry!.inject as (sessionId: never) => CanvasViewInjected)', '(entry!.inject as unknown as (sessionId: never) => CanvasViewInjected)')
          capability.write_text(text)

          bundle = Path('packages/client/ui-canvas/tests/client-bundle.client.spec.ts')
          text = bundle.read_text()
          text = text.replace('await enabled.ctx.dispose()', 'await enabled.ctx.fiber.dispose()')
          text = text.replace('await disabled.ctx.dispose()', 'await disabled.ctx.fiber.dispose()')
          bundle.write_text(text)

          features = Path('packages/client/ui-canvas/tests/features.client.spec.tsx')
          text = features.read_text()
          text = text.replace("  resolvedCapabilities: CanvasCapabilities = capabilities({ editor: false }),\n", '')
          text = text.replace("  } as CanvasSnapshot & { workflow: NonNullable<CanvasSnapshot['workflow']> }", "  } as unknown as CanvasSnapshot & { workflow: NonNullable<CanvasSnapshot['workflow']> }")
          features.write_text(text)

          view = Path('packages/client/ui-canvas/tests/view.client.spec.tsx')
          text = view.read_text()
          start = text.find('const capabilities: CanvasCapabilities = {')
          if start >= 0:
              marker = "describe('Canvas Minimal surface'"
              end = text.find(marker, start)
              if end < 0:
                  raise SystemExit('view: predecessor helper found but N07 describe marker missing')
              text = text[:start] + text[end:]
          text = text.replace("import type { ComponentProps } from 'react'\n", '')
          text = text.replace("import type { CanvasCapabilities, CanvasSnapshot } from '@deepseek-ai/dsh-canvas/client'", "import type { CanvasSnapshot } from '@deepseek-ai/dsh-canvas/client'")
          text = text.replace("import { CanvasView, MinimalCanvas } from '../src/client/CanvasView.tsx'", "import { MinimalCanvas } from '../src/client/CanvasView.tsx'")
          text = text.replace('  } as CanvasSnapshot\n', '  } as unknown as CanvasSnapshot\n', 1)
          view.write_text(text)
          PY

          git diff --check
          test -z "$(git ls-files -u)"
          git merge-base --is-ancestor origin/fix/canvas-n06-v2.2-remote-history HEAD
          grep -Fq "PropsRuntime<'shell.main'>" packages/client/ui-canvas/src/client/CanvasView.tsx
          grep -Fq "'shell.main': { kind: 'single'; scope: 'session'" packages/client/ui-layout/src/client/index.ts
          echo "N06->N07 merge, shell ownership, and scoped carry-forward fixes: PASS"

      - name: Reconcile N07 workspace lock importer
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --lockfile-only --no-frozen-lockfile >/tmp/lock.log 2>&1 || { tail -n 120 /tmp/lock.log; exit 1; }
          changed="$(git diff --numstat -- pnpm-lock.yaml | awk '{ print $1 + $2 }')"
          test -n "$changed"
          test "$changed" -le 20
          python - <<'PY'
          from pathlib import Path
          text = Path('pnpm-lock.yaml').read_text()
          marker = '  packages/client/ui-canvas:\n'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('ui-canvas importer missing from pnpm-lock.yaml')
          next_importer = text.find('\n  packages/', start + len(marker))
          block = text[start:] if next_importer < 0 else text[start:next_importer]
          if "'@deepseek-ai/dsh-client-ui-layout':" not in block:
              raise SystemExit('ui-layout workspace dependency missing from ui-canvas lock importer')
          if 'specifier: workspace:^' not in block:
              raise SystemExit('workspace:^ specifier missing from ui-canvas lock importer')
          PY
          git diff --check -- pnpm-lock.yaml
          echo "N07 lock importer reconciliation: PASS (${changed} changed lines)"

      - name: Install immutable workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1 || { tail -n 160 /tmp/install.log; exit 1; }
          echo "Frozen workspace install: PASS"

      - name: Validate inherited Host build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:lib:host >/tmp/host-build.log 2>&1 || { tail -n 220 /tmp/host-build.log; exit 1; }
          echo "Host build: PASS"

      - name: Validate N07 Client build
        shell: bash
        run: |
          set -o pipefail
          if ! pnpm run build:lib:client >/tmp/client-build.log 2>&1; then
            echo "=== CLIENT BUILD DIAGNOSTICS ==="
            grep -E "error TS[0-9]+|ERROR|Error:|ELIFECYCLE|ERR_PNPM|ui-canvas|ui-layout" /tmp/client-build.log | tail -n 240 || true
            echo "=== CLIENT BUILD TAIL ==="
            tail -n 260 /tmp/client-build.log
            exit 1
          fi
          echo "Client build: PASS"

      - name: Run N07 focused regressions
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/client/ui-canvas/tests/capability-gate.client.spec.ts \
            packages/client/ui-canvas/tests/client-bundle.client.spec.ts \
            packages/client/ui-canvas/tests/features.client.spec.tsx \
            packages/client/ui-canvas/tests/interaction.client.spec.ts \
            packages/client/ui-canvas/tests/mode-store.client.spec.ts \
            packages/client/ui-canvas/tests/store.client.spec.ts \
            packages/client/ui-canvas/tests/view.client.spec.tsx \
            packages/client/ui-canvas/tests/layout-revision.client.spec.ts \
            packages/client/ui-canvas/tests/state.client.spec.ts \
            packages/client/ui-layout/tests/app-frame.client.spec.tsx \
            packages/client/ui-layout/tests/apply.client.spec.ts \
            packages/client/ui-layout/tests/service.client.spec.ts \
            packages/bundle/base/tests/canvas-real-composition.spec.ts >/tmp/n07-tests.log 2>&1 || { tail -n 300 /tmp/n07-tests.log; exit 1; }
          tail -n 100 /tmp/n07-tests.log

      - name: Validate built package invariants
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify-built-package-invariants >/tmp/invariants.log 2>&1 || { tail -n 240 /tmp/invariants.log; exit 1; }
          tail -n 100 /tmp/invariants.log

      - name: Commit and push only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git add pnpm-lock.yaml \
            packages/client/ui-canvas/src/client/store.ts \
            packages/client/ui-canvas/tests/capability-gate.client.spec.ts \
            packages/client/ui-canvas/tests/client-bundle.client.spec.ts \
            packages/client/ui-canvas/tests/features.client.spec.tsx \
            packages/client/ui-canvas/tests/view.client.spec.tsx
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:fix/canvas-n07-v2.2-dynamic-surface
