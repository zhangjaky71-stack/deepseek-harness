# Validation branch marker; synced to N03 head 616d888.
name: Canvas N03 focused validation

on:
  pull_request:
    branches:
      - fix/canvas-n03-v2.2-durable-authority

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  n03-focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Run N03 focused Canvas tests
        run: >-
          pnpm exec vitest run
          packages/canvas/canvas/tests/domain.spec.ts
          packages/canvas/canvas/tests/migration.spec.ts
          packages/canvas/canvas/tests/fold.spec.ts
          packages/canvas/canvas/tests/service.spec.ts
          packages/canvas/canvas/tests/invariant.spec.ts
          packages/canvas/canvas/tests/authorization.spec.ts
          packages/canvas/canvas/tests/remote.spec.ts
          packages/canvas/canvas/tests/features.spec.ts
          packages/canvas/canvas/tests/projection.spec.ts
