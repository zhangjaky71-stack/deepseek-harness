name: Canvas N10 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n10-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n10-sync-trigger'
    runs-on: ubuntu-24.04
    env:
      DSH_GATE_CONCURRENCY: '8'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n10-v2.2-node-registry
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Merge validated N09 predecessor and assert N10 ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/canvas-n09-v2.2-settings-authority fix/canvas-n10-v2.2-node-registry
          git merge --no-edit origin/fix/canvas-n09-v2.2-settings-authority
          git merge-base --is-ancestor origin/fix/canvas-n09-v2.2-settings-authority HEAD
          test -z "$(git ls-files -u)"
          grep -Fq 'snapshot(): MediaNodeRegistrySnapshot' packages/canvas/media-workflow/src/registry.ts
          grep -Fq 'revision: this.revision' packages/canvas/media-workflow/src/registry.ts
          grep -Fq 'CanvasNodeCatalogSnapshot' packages/canvas/canvas/src/feature-service.ts
          grep -Fq 'nodeCatalogRevision = catalog.value.revision' packages/client/ui-canvas/src/client/index.ts
          grep -Fq "static inject = ['settings']" packages/canvas/canvas/src/feature-service.ts
          echo "N09->N10 ordinary merge + node-registry ownership assertions: PASS"

      - name: Install immutable candidate workspace
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile >/tmp/install.log 2>&1 || { tail -n 220 /tmp/install.log; exit 1; }
          echo "N10 frozen workspace install: PASS"

      - name: Validate repository static gates against N09 baseline
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm run check:ci:static >/tmp/n10-static.log 2>&1
          candidate_static=$?
          set -e
          if (( candidate_static == 0 )); then
            echo "N10 repository static gates: PASS"
          else
            python - <<'PY'
          from pathlib import Path
          import re

          log = Path('/tmp/n10-static.log').read_text(errors='replace')
          baseline_failed = {
              'constraints', 'package invariants', 'Cordis config', 'cordis catalog',
              'client catalog', 'export jsdoc', 'config catalog', 'persistence catalog',
              'doc graphs', 'package README model experience', 'agent note classification',
              'agent note format', 'type equivalence', 'translation pairing', 'module graph', 'knip',
          }
          actual = set(re.findall(r'^  - FAILED (.+?) \(', log, re.MULTILINE))
          unexpected = actual - baseline_failed
          if unexpected:
              raise SystemExit(f'N10 introduced new failing static gates beyond N09 baseline: {sorted(unexpected)}')
          if 'run-gates: PASS optional dependency imports' not in log:
              raise SystemExit('N10 optional-dependency-import gate did not pass')
          print(f'N10 failing static gate set remains within N09 baseline: {sorted(actual)}')
          PY
          fi

          rm -rf /tmp/n09-static
          git worktree add --detach /tmp/n09-static origin/fix/canvas-n09-v2.2-settings-authority >/tmp/worktree.log 2>&1
          (cd /tmp/n09-static && pnpm install --frozen-lockfile >/tmp/n09-install.log 2>&1) || { tail -n 220 /tmp/n09-install.log; exit 1; }

          gates=(
            constraints
            verify-package-invariants
            verify-package-paths
            verify-node-next-types
            verify-runtime-closure
            verify-optional-dependency-imports
            verify-cordis-config
            verify-cordis-catalog
            verify-client-catalog
            verify-client-domain-graph
            verify-export-jsdoc
            verify-config-catalog
            verify-doc-graphs
            verify-package-readme-model-experience
            verify-agent-note-classification
            verify-agent-note-format
            verify-type-equiv
            verify-translation-pairing
            verify-module-graph
            knip
          )

          for gate in "${gates[@]}"; do
            set +e
            (cd /tmp/n09-static && pnpm run "$gate") >"/tmp/base-$gate.log" 2>&1
            base_status=$?
            pnpm run "$gate" >"/tmp/candidate-$gate.log" 2>&1
            candidate_status=$?
            set -e
            BASE_STATUS="$base_status" CANDIDATE_STATUS="$candidate_status" GATE="$gate" python - <<'PY'
          from pathlib import Path
          import os, re

          gate = os.environ['GATE']
          base_status = int(os.environ['BASE_STATUS'])
          candidate_status = int(os.environ['CANDIDATE_STATUS'])
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          candidate_root = str(Path.cwd())
          baseline_root = '/tmp/n09-static'

          def normalized(path: str) -> set[str]:
              out: set[str] = set()
              for raw in Path(path).read_text(errors='replace').splitlines():
                  line = ansi.sub('', raw).strip()
                  line = line.replace(candidate_root, '<ROOT>').replace(baseline_root, '<ROOT>')
                  if not line:
                      continue
                  if line.startswith('> @deepseek-ai/dsh-root@') or line.startswith('$ '):
                      continue
                  if line.startswith('ELIFECYCLE') or line.startswith('ERR_PNPM'):
                      continue
                  out.add(line)
              return out

          base = normalized(f'/tmp/base-{gate}.log')
          candidate = normalized(f'/tmp/candidate-{gate}.log')
          if candidate_status == 0:
              print(f'{gate}: candidate PASS (baseline status {base_status})')
          else:
              if base_status == 0:
                  raise SystemExit(f'{gate}: N10 FAIL while validated N09 baseline PASS')
              unexpected = candidate - base
              if unexpected:
                  print(f'=== {gate} N09 baseline ===')
                  print(Path(f'/tmp/base-{gate}.log').read_text(errors='replace'))
                  print(f'=== {gate} N10 candidate ===')
                  print(Path(f'/tmp/candidate-{gate}.log').read_text(errors='replace'))
                  raise SystemExit(f'{gate}: N10 introduced diagnostics beyond N09 baseline: {sorted(unexpected)}')
              print(f'{gate}: no new diagnostics beyond N09 baseline ({len(candidate)} candidate / {len(base)} baseline normalized lines)')
          PY
          done
          git worktree remove --force /tmp/n09-static
          echo "N10 targeted static diagnostic differential: PASS"

      - name: Validate Host build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:lib:host >/tmp/host-build.log 2>&1 || { tail -n 360 /tmp/host-build.log; exit 1; }
          echo "Host build: PASS"

      - name: Validate Client build
        shell: bash
        run: |
          set -o pipefail
          pnpm run build:lib:client >/tmp/client-build.log 2>&1 || { tail -n 360 /tmp/client-build.log; exit 1; }
          echo "Client build: PASS"

      - name: Run N10 focused and predecessor regressions
        shell: bash
        run: |
          set -o pipefail
          pnpm exec vitest run \
            packages/canvas/media-workflow/tests/registry.spec.ts \
            packages/canvas/media-workflow/tests/plugin-node.spec.ts \
            packages/canvas/canvas/tests/migration.spec.ts \
            packages/canvas/canvas/tests/features.spec.ts \
            packages/canvas/canvas/tests/feature-settings.spec.ts \
            packages/canvas/canvas/tests/interaction-features.spec.ts \
            packages/canvas/canvas/tests/interaction.spec.ts \
            packages/canvas/canvas/tests/interaction-bridge.spec.ts \
            packages/client/ui-canvas/tests/capability-gate.client.spec.ts \
            packages/client/ui-canvas/tests/settings.client.spec.tsx \
            packages/client/ui-canvas/tests/features.client.spec.tsx \
            packages/client/ui-canvas/tests/interaction.client.spec.ts \
            packages/client/ui-canvas/tests/client-bundle.client.spec.ts \
            packages/bundle/base/tests/canvas-real-composition.spec.ts >/tmp/n10-tests.log 2>&1 || { tail -n 480 /tmp/n10-tests.log; exit 1; }
          tail -n 220 /tmp/n10-tests.log

      - name: Validate built package invariants
        shell: bash
        run: |
          set -o pipefail
          pnpm run verify-built-package-invariants >/tmp/invariants.log 2>&1 || { tail -n 320 /tmp/invariants.log; exit 1; }
          tail -n 140 /tmp/invariants.log

      - name: Push only after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/canvas-n10-v2.2-node-registry
