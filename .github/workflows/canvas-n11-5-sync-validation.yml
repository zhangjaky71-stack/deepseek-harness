name: Canvas N11.5 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n11-5-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n11-5-sync-trigger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n11-5-v2.2-rc8-compatibility
          fetch-depth: 0

      - name: Merge validated N11 predecessor and print exact conflicts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/canvas-n11-v2.2-editor-workspace fix/canvas-n11-5-v2.2-rc8-compatibility
          set +e
          git merge --no-edit origin/fix/canvas-n11-v2.2-editor-workspace
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            echo "N11->N11.5 ordinary merge conflicts:"
            git diff --name-only --diff-filter=U
            exit "$merge_status"
          fi
          git merge-base --is-ancestor origin/fix/canvas-n11-v2.2-editor-workspace HEAD
          test -z "$(git ls-files -u)"
          echo "N11->N11.5 ordinary merge: PASS"
