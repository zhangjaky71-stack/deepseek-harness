name: Canvas N11.5 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n11-5-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n11-5-sync-trigger'
    runs-on: ubuntu-24.04
    env:
      DSH_GATE_CONCURRENCY: '8'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n11-5-v2.2-rc8-renderer-root
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          ref: main
          path: _validator

      - name: Materialize trusted validator
        shell: bash
        run: |
          cp _validator/.github/scripts/canvas-n11-5-renderer-validation.sh /tmp/canvas-n11-5-renderer-validation.sh
          chmod +x /tmp/canvas-n11-5-renderer-validation.sh
          rm -rf _validator

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Semantic predecessor merge
        run: /tmp/canvas-n11-5-renderer-validation.sh merge

      - name: Reconcile renderer lockfile with repository toolchain
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm install --frozen-lockfile >/tmp/frozen-before.log 2>&1
          frozen_status=$?
          set -e
          if [ "$frozen_status" -eq 0 ]; then
            echo "Frozen install already passed; no lock reconciliation needed."
          else
            grep -Fq 'ERR_PNPM_OUTDATED_LOCKFILE' /tmp/frozen-before.log
            grep -Fq 'packages/client/ui-renderer/package.json' /tmp/frozen-before.log
            pnpm install --no-frozen-lockfile >/tmp/lock-reconcile.log 2>&1 || { tail -n 320 /tmp/lock-reconcile.log; exit 1; }
            mapfile -t unstaged < <(git diff --name-only | sort)
            expected=("pnpm-lock.yaml")
            test "${unstaged[*]}" = "${expected[*]}"
            git add pnpm-lock.yaml
          fi
          pnpm install --frozen-lockfile >/tmp/frozen-after.log 2>&1 || { tail -n 320 /tmp/frozen-after.log; exit 1; }

      - name: Pair notes and commit merge
        shell: bash
        run: |
          set -euo pipefail
          /tmp/canvas-n11-5-renderer-validation.sh pair-commit
          pnpm run verify-translation-pairing --write packages/client/modules/README.md
          git add packages/client/modules/README.i18n.yaml
          git commit --amend --no-edit
          git merge-base --is-ancestor origin/fix/canvas-n11-5-v2.2-rc8-compatibility HEAD

      - name: Host build
        run: /tmp/canvas-n11-5-renderer-validation.sh host-build

      - name: Client build
        run: /tmp/canvas-n11-5-renderer-validation.sh client-build

      - name: Diagnose Cordis catalog export resolution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/typert/generator/src/analyzer.ts')
          text = path.read_text()
          old = '''    const sourceFile = this.sourceFiles.get(realPath(sourcePathForExport(registration.root, target))) as ts.SourceFile
              const moduleSymbol = this.checker.getSymbolAtLocation(sourceFile) as ts.Symbol
              const exported = this.checker.getExportsOfModule(moduleSymbol)
          '''
          new = '''    const sourcePath = realPath(sourcePathForExport(registration.root, target))
              const sourceFile = this.sourceFiles.get(sourcePath)
              if (sourceFile === undefined) {
                throw new Error(`TY-SOURCEFILE-DIAGNOSTIC package=${module.package} subpath=${module.subpath} face=${face} requested=${requestedName} symbol=${symbol.name} target=${target} sourcePath=${sourcePath} registrationRoot=${registration.root}`)
              }
              const moduleSymbol = this.checker.getSymbolAtLocation(sourceFile)
              if (moduleSymbol === undefined) {
                throw new Error(`TY-MODULE-SYMBOL-DIAGNOSTIC package=${module.package} subpath=${module.subpath} face=${face} requested=${requestedName} symbol=${symbol.name} target=${target} sourcePath=${sourcePath}`)
              }
              const exported = this.checker.getExportsOfModule(moduleSymbol)
          '''
          if old not in text:
              raise SystemExit('packageExportName source-file patch anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm run verify-cordis-catalog
