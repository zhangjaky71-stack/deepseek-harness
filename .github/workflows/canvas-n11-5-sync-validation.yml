name: Canvas N11.5 sync validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  canvas-n11-5-sync:
    if: github.event.pull_request.head.ref == 'ci/canvas-n11-5-sync-trigger'
    runs-on: ubuntu-24.04
    env:
      DSH_GATE_CONCURRENCY: '8'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/canvas-n11-5-v2.2-rc8-renderer-root
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          ref: main
          path: _validator

      - name: Materialize trusted validator
        shell: bash
        run: |
          cp _validator/.github/scripts/canvas-n11-5-renderer-validation.sh /tmp/canvas-n11-5-renderer-validation.sh
          chmod +x /tmp/canvas-n11-5-renderer-validation.sh
          rm -rf _validator

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Semantic predecessor merge
        run: /tmp/canvas-n11-5-renderer-validation.sh merge

      - name: Frozen install
        run: /tmp/canvas-n11-5-renderer-validation.sh install

      - name: Pair notes and commit merge
        run: /tmp/canvas-n11-5-renderer-validation.sh pair-commit

      - name: Ownership assertions
        run: /tmp/canvas-n11-5-renderer-validation.sh ownership

      - name: Exact overlay static differential
        run: /tmp/canvas-n11-5-renderer-validation.sh static

      - name: Host build
        run: /tmp/canvas-n11-5-renderer-validation.sh host-build

      - name: Client build
        run: /tmp/canvas-n11-5-renderer-validation.sh client-build

      - name: Renderer/module/overlay regressions
        run: /tmp/canvas-n11-5-renderer-validation.sh tests

      - name: Built package invariants
        run: /tmp/canvas-n11-5-renderer-validation.sh invariants

      - name: Gated push
        run: /tmp/canvas-n11-5-renderer-validation.sh push
